services:
  redis:
    image: redis:latest
    container_name: local-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  core:
    build: ./core
    container_name: core-service
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis

volumes:
  redis-data:
